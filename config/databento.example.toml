# Historical US equity market data from Databento (`venue = "databento"`), for
# backtesting strategies on multi-year intraday bars and top-of-book quotes.
# Copy to config/databento.toml and edit.
#
# Credentials do NOT go in this file. For HTTP pulls set:
#   KESTREL_DATABENTO_API_KEY in the environment, or
#   [databento] api_key in secrets.toml next to this file.
# Offline batch imports (`databento --file ...`) and `backtest` need no key.
#
# Check the cost first, then import and backtest:
#   ./build/kestrel_app -c config/databento.toml databento \
#       --schema bbo-1s --from 2025-01-01 --to 2025-02-01 --dry-run
#   ./build/kestrel_app -c config/databento.toml databento \
#       --schema ohlcv-1m --rollup 5m,15m,30m \
#       --from 2025-01-01 --to 2025-02-01 --max-cost 2.00 --store
#   ./build/kestrel_app -c config/databento.toml backtest ma_crossover \
#       --from 2025-01-02 --to 2025-02-01

[general]
provider = "databento"
mode     = "paper"
symbols  = ["SPY", "QQQ"]      # share classes as "BRK.B"

[paper]
initial_balances = { USD = "10000" }
maker_fee_bps = 0
taker_fee_bps = 0
slippage_bps  = 5

[databento]
# Single-publisher dataset code (e.g. EQUS.MINI, XNAS.ITCH, XNYS.PILLAR).
# Avoid multi-venue bundles such as DBEQ.BASIC, which mix per-exchange books.
dataset        = "EQUS.MINI"
# Keep bars, quotes and trades in extended hours (07:00 to 09:30 and 16:00 to
# 20:00 New York time) as well as the regular 09:30 to 16:00 session.
extended_hours = false

[strategy]
symbol    = "SPY"
quantity  = "1"
timeframe = "15m"

# [database]                   # required for --store and quote backtests
# host   = "localhost"
# port   = 5432
# dbname = "kestrel"
# user   = "kestrel"
