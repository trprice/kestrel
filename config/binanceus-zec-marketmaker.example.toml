# Market-making backtest of ZEC/USDT on Binance.US, with stored quotes and the
# fee schedule of a Binance.US account paying 0% maker and 0.02% taker.
# Run: ./build/kestrel_app --config config/binanceus-zec-marketmaker.example.toml \
#          backtest market_maker --from 2026-10-19T17:00:00Z --to 2026-10-20T01:10:00Z
# The quotes come from the database ([database]); symbol info from the venue.

[general]
provider = "binanceus"
mode     = "paper"
symbols  = ["ZEC/USDT"]

[database]
dbname = "kestrel"
host   = "localhost"
user   = "kestrel"
# password: KESTREL_DATABASE_PASSWORD

# Uncomment to store the fills, a P&L snapshot and the venue's response times
# every minute of `run` in the database above; see "Recording a run" in
# docs/database.md.
# [recording]
# enabled = true

[paper]
initial_balances = { USDT = "10000", ZEC = "2" }
maker_fee_bps = 0              # 0%
taker_fee_bps = 2              # 0.02%
slippage_bps  = 0
limit_fill_model = "conservative"
# The live round trips: orders and cancels take 130 ms to reach the book
# (the REST round trip, as the replayed quotes already carry the feed's
# delay), and fills reach the strategy about 600 ms later (Binance.US is
# polled every second). Without them a backtest flatters the market maker.
order_latency_ms  = 130
report_latency_ms = 600

[strategy]
symbol           = "ZEC/USDT"
quantity         = "0.05"      # ZEC per quote
half_spread_bps  = 4           # the market's own is about 1.5. In the Oct 2026
                               # replays, with the latencies above, only 6 beat
                               # holding, and only on inventory; see TODO.md
max_inventory    = "0.5"       # ZEC either side of the starting 2
skew_bps         = 4
requote_bps      = 6           # replace a quote the market moved away from
requote_toward_bps = 0         # ...but one it moved towards at once (TODO.md)
# Widen the spread with volatility: the half-spread becomes the larger of
# half_spread_bps and vol_multiplier times the mid's typical one-minute move
# in bps over vol_window_ms (about 11 bps on ZEC/USDT in Oct 2026, so 0.4
# quotes about 4.4 bps). Off at 0, the default; max_half_spread_bps 0 is no cap.
# vol_multiplier      = 0.4
# vol_window_ms       = 300000
# max_half_spread_bps = 0
# Centre the quotes towards the microprice (0: the mid, 1: the full weighted
# mid). It did not help in the Oct 2026 replays; see TODO.md.
# microprice_weight   = 0
# Pull the bid while the trades of the last flow_window_ms were mostly sales
# (imbalance at or below -flow_pull_imbalance, by size), the ask while they
# were mostly purchases. Off at 0. It helped at 2 and 4 bps but not at 6 in
# the Oct 2026 replays; see TODO.md.
# flow_pull_imbalance = 0.5
# flow_window_ms      = 2000
# Post-only quotes are refused instead of filling as a taker when the book
# moves through them in flight. Keep it on in paper runs and backtests too:
# without it the Nov 2026 ZEC/USDT replays lost several times as much
# (4 bps: -134 against -31 vs hold over four days).
post_only        = true
# Queue position: hold a computed price to the best price on its side
# ("join"), or a tick inside it ("improve"), and keep a quote at the touch
# when its target moves away. On ZEC/USDT (a tick of 0.08 bps) join and
# improve helped only at 2 bps in the Nov 2026 replays, and keep_at_touch
# changed nothing; see TODO.md.
# touch          = "join"
# keep_at_touch  = true
# Lean harder on a large position (the lean to this power) or an old one
# (the skew doubling by this age). Neither was clearly better in the Nov
# 2026 replays (TODO.md); the values are examples, not recommendations.
# skew_power     = 2
# skew_age_ms    = 1800000
# Quote this many levels a side, each level_step_bps behind the one before
# (default: half_spread_bps). They did not help on ZEC/USDT in the Nov 2026
# replays, and each level is its own order (see TODO.md).
# levels         = 2
# level_step_bps = 8
# Pull both quotes after this long with no quote (a stalled feed). The book
# stream is silent while the book is unchanged, so keep it to tens of
# seconds; 2-5 s pulled thousands of times in the replays and lost money.
# quiet_pull_ms  = 60000

# Drawdown protection. Every rule is off until its flag is set to true; the
# numbers shown are the defaults (loss_cap_amount and drawdown_cap_amount have
# none, and are required when their rule is on). "The position" is the base
# held beyond the starting balance. Amounts are in USDT. See
# MarketMakerProtection in include/kestrel/strategy/market_maker.hpp.
#
# Exit the position at market when it is this far under its average entry.
# stop_loss           = true
# stop_loss_bps       = 40
# Stop for good (cancel, exit at market, no more quotes) when the P&L since
# the start reaches -loss_cap_amount, or falls this far from its peak.
# loss_cap            = true
# loss_cap_amount     = "3"
# drawdown_cap        = true
# drawdown_cap_amount = "3"
# Cancel both quotes for spike_pause_ms after a move this big in 3, 5 or 15
# minutes.
# spike_standdown     = true
# spike_3m_bps        = 50
# spike_5m_bps        = 80
# spike_15m_bps       = 120
# spike_pause_ms      = 900000
# No bids while the 15 minute move is down this far.
# downtrend_filter    = true
# downtrend_bps       = 30
# No bids while the 3 minute move is below -momentum_bps.
# momentum_filter     = true
# momentum_bps        = 0
# After a stop_loss exit, quote neither side for cooldown_ms.
# cooldown_after_stop = true
# cooldown_ms         = 1800000
# The loss and drawdown caps, the stand-down and the cooldown are kept in the
# [database] across restarts, so the caps count every run and a halt lasts.
# Set reset_state for one run to start afresh.
# reset_state         = true
