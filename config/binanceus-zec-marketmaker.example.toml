# Market-making backtest of ZEC/USDT on Binance.US, with stored quotes and the
# fee schedule of a Binance.US account paying 0% maker and 0.02% taker.
# Run: ./build/kestrel_app --config config/binanceus-zec-marketmaker.example.toml \
#          backtest market_maker --from 2026-10-19T17:00:00Z --to 2026-10-20T01:10:00Z
# The quotes come from the database ([database]); symbol info from the venue.

[general]
provider = "binanceus"
mode     = "paper"
symbols  = ["ZEC/USDT"]

[database]
dbname = "kestrel"
host   = "localhost"
user   = "kestrel"
# password: KESTREL_DATABASE_PASSWORD

# Uncomment to store the fills, a P&L snapshot and the venue's response times
# every minute of `run` in the database above; see "Recording a run" in
# docs/database.md.
# [recording]
# enabled = true

[paper]
initial_balances = { USDT = "10000", ZEC = "2" }
maker_fee_bps = 0              # 0%
taker_fee_bps = 2              # 0.02%
slippage_bps  = 0
limit_fill_model = "conservative"
# The live round trips: orders and cancels take 130 ms to reach the book
# (the REST round trip, as the replayed quotes already carry the feed's
# delay), and fills reach the strategy about 600 ms later (Binance.US is
# polled every second). Without them a backtest flatters the market maker.
order_latency_ms  = 130
report_latency_ms = 600

[strategy]
symbol           = "ZEC/USDT"
quantity         = "0.05"      # ZEC per quote
half_spread_bps  = 4           # the market's own is about 1.5. In the Oct 2026
                               # replays, with the latencies above, only 6 beat
                               # holding, and only on inventory; see TODO.md
max_inventory    = "0.5"       # ZEC either side of the starting 2
skew_bps         = 4
requote_bps      = 0.5
# Widen the spread with volatility: the half-spread becomes the larger of
# half_spread_bps and vol_multiplier times the mid's typical one-minute move
# in bps over vol_window_ms (about 11 bps on ZEC/USDT in Oct 2026, so 0.4
# quotes about 4.4 bps). Off at 0, the default; max_half_spread_bps 0 is no cap.
# vol_multiplier      = 0.4
# vol_window_ms       = 300000
# max_half_spread_bps = 0
# post_only      = true        # refuse instead of filling as a taker (live)

# Drawdown protection. Every rule is off until its flag is set to true; the
# numbers shown are the defaults (loss_cap_amount and drawdown_cap_amount have
# none, and are required when their rule is on). "The position" is the base
# held beyond the starting balance. Amounts are in USDT. See
# MarketMakerProtection in include/kestrel/strategy/market_maker.hpp.
#
# Exit the position at market when it is this far under its average entry.
# stop_loss           = true
# stop_loss_bps       = 40
# Stop for good (cancel, exit at market, no more quotes) when the P&L since
# the start reaches -loss_cap_amount, or falls this far from its peak.
# loss_cap            = true
# loss_cap_amount     = "3"
# drawdown_cap        = true
# drawdown_cap_amount = "3"
# Cancel both quotes for spike_pause_ms after a move this big in 3, 5 or 15
# minutes.
# spike_standdown     = true
# spike_3m_bps        = 50
# spike_5m_bps        = 80
# spike_15m_bps       = 120
# spike_pause_ms      = 900000
# No bids while the 15 minute move is down this far.
# downtrend_filter    = true
# downtrend_bps       = 30
# No bids while the 3 minute move is below -momentum_bps.
# momentum_filter     = true
# momentum_bps        = 0
# After a stop_loss exit, quote neither side for cooldown_ms.
# cooldown_after_stop = true
# cooldown_ms         = 1800000
