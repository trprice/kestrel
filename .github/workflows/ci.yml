# Builds Kestrel and runs the whole test suite, database tests included, in
# the image from the Dockerfile (see docs/testing.md), and keeps a Release
# kestrel_app built in the same image as an artifact for deploying.
name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Build and test
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5

      - uses: docker/setup-buildx-action@v3

      # The apt packages and IXWebSocket are cached; only the last layer (the
      # source) changes from push to push.
      - name: Build the test image
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: kestrel-test
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # The entrypoint starts PostgreSQL, builds /src and runs ctest serially
      # (the database tests share fixture rows). Hosted runners have 16 GB,
      # enough for 4 compile jobs.
      - name: Build and run the tests
        run: docker run --rm --network none -e KESTREL_JOBS=4 kestrel-test

  package:
    name: Release binary
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5

      - uses: docker/setup-buildx-action@v3

      - name: Build the image
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: kestrel-test
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Built on Ubuntu 26.04, so it runs on a 26.04 host with the runtime
      # libraries installed (`ldd kestrel_app` lists them).
      - name: Build kestrel_app (Release)
        run: |
          mkdir -p dist
          docker run --rm --network none -v "$PWD/dist":/dist \
            --entrypoint bash kestrel-test -c '
              set -euo pipefail
              cmake -S /src -B /release -G Ninja -DCMAKE_BUILD_TYPE=Release \
                -DKESTREL_BUILD_TESTS=OFF
              cmake --build /release -j4
              strip -o /dist/kestrel_app /release/kestrel_app
              chown "'"$(id -u):$(id -g)"'" /dist/kestrel_app'

      - uses: actions/upload-artifact@v4
        with:
          name: kestrel_app-${{ github.sha }}
          path: dist/kestrel_app
          retention-days: 30
